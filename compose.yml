services:
  flask:
    build:
      context: ./app
      dockerfile: Containerfile
    container_name: flask-app
    restart: unless-stopped

  nginx:
    image: docker.io/library/nginx:alpine
    container_name: nginx-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,Z
    depends_on:
      - flask
    restart: unless-stopped
